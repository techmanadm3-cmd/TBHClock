name: TBHClock - Runner Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runner-check.yml"

permissions:
  contents: read

jobs:
  runner-check:
    name: Validate TBH-CLOCK-WIN01
    runs-on: [self-hosted, Windows, X64, tbh-clock]
    timeout-minutes: 5

    steps:
      - name: Runner identity
        shell: cmd
        run: |
          @echo off
          echo RUNNER_NAME=%RUNNER_NAME%
          if /I not "%RUNNER_NAME%"=="TBH-CLOCK-WIN01" exit /b 11
          echo RUNNER_IDENTITY=PASS

      - name: Tool check
        shell: cmd
        run: |
          @echo off
          git --version || exit /b 21
          node --version || exit /b 22
          npm --version || exit /b 23
          where ssh.exe || exit /b 24
          echo GIT_NODE_NPM_SSH=PASS

      - name: Final result
        shell: cmd
        run: |
          @echo off
          echo TBHCLOCK_WINDOWS_RUNNER=PASS
          echo DEPLOY=OFF
