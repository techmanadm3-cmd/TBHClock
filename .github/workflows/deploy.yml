name: TBHClock - Deploy VPS2 Manual Fallback

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Validated main commit SHA to deploy manually"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tbhclock-deploy-vps2-manual
  cancel-in-progress: false

jobs:
  deploy:
    name: Manual fallback deploy from TBH-CLOCK-WIN01
    runs-on: [self-hosted, Windows, X64, tbh-clock, vps2-deploy]
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}

    steps:
      - name: Verify runner and local SSH config
        shell: cmd
        run: |
          @echo off
          if /I not "%RUNNER_NAME%"=="TBH-CLOCK-WIN01" exit /b 11
          set "ROOT=%ProgramData%\TBHClock-SSH"
          if not exist "%ROOT%\id_ed25519" exit /b 12
          if not exist "%ROOT%\known_hosts" exit /b 13
          if not exist "%ROOT%\deploy.env" exit /b 14
          echo MANUAL_DEPLOY_GATE=READY

      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: cmd
        run: |
          @echo off
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL=%%H"
          if /I not "%ACTUAL%"=="%TARGET_SHA%" exit /b 21
          echo COMMIT_SHA=PASS

      - name: Deploy
        shell: cmd
        run: |
          @echo off
          set "ROOT=%ProgramData%\TBHClock-SSH"
          for /f "usebackq tokens=1,* delims==" %%A in ("%ROOT%\deploy.env") do (
            if not "%%A"=="" set "%%A=%%B"
          )
          "%WINDIR%\System32\OpenSSH\ssh.exe" -T -p %TBHCLOCK_SSH_PORT% -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="%ROOT%\known_hosts" -i "%ROOT%\id_ed25519" "%TBHCLOCK_SSH_USER%@%TBHCLOCK_SSH_HOST%" runtime-check || exit /b 31
          "%WINDIR%\System32\OpenSSH\ssh.exe" -T -p %TBHCLOCK_SSH_PORT% -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="%ROOT%\known_hosts" -i "%ROOT%\id_ed25519" "%TBHCLOCK_SSH_USER%@%TBHCLOCK_SSH_HOST%" "deploy %TARGET_SHA%" || exit /b 32
          echo MANUAL_VPS2_DEPLOY=PASS
