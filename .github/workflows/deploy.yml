name: TBHClock - Deploy VPS2

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Validated main commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tbhclock-deploy-vps2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy validated source from TBH-CLOCK-WIN01
    runs-on: [self-hosted, Windows, X64, tbh-clock, vps2-deploy]
    timeout-minutes: 15

    steps:
      - name: Runner identity
        shell: cmd
        run: |
          @echo off
          if /I not "%RUNNER_NAME%"=="TBH-CLOCK-WIN01" exit /b 11
          echo DEPLOY_RUNNER=PASS

      - name: Load dedicated VPS2 SSH configuration
        shell: cmd
        run: |
          @echo off
          set "ROOT=%ProgramData%\TBHClock-SSH"
          if not exist "%ROOT%\id_ed25519" exit /b 21
          if not exist "%ROOT%\known_hosts" exit /b 22
          if not exist "%ROOT%\deploy.env" exit /b 23
          for /f "usebackq tokens=1,* delims==" %%A in ("%ROOT%\deploy.env") do (
            if not "%%A"=="" set "%%A=%%B"
          )
          if "%TBHCLOCK_SSH_HOST%"=="" exit /b 24
          if "%TBHCLOCK_SSH_PORT%"=="" exit /b 25
          if "%TBHCLOCK_SSH_USER%"=="" exit /b 26
          echo SSH_CONFIG=PASS
          exit /b 0

      - name: Checkout requested validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify requested commit
        shell: cmd
        run: |
          @echo off
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL=%%H"
          if /I not "%ACTUAL%"=="${{ inputs.commit_sha }}" exit /b 31
          echo COMMIT_SHA=PASS

      - name: Package release
        shell: cmd
        run: |
          @echo off
          if exist "%RUNNER_TEMP%\tbhclock-release.tar.gz" del /q "%RUNNER_TEMP%\tbhclock-release.tar.gz"
          git archive --format=tar.gz -o "%RUNNER_TEMP%\tbhclock-release.tar.gz" HEAD || exit /b 41
          echo PACKAGE=PASS

      - name: Upload and activate through dedicated VPS2 gateway
        shell: cmd
        run: |
          @echo off
          set "ROOT=%ProgramData%\TBHClock-SSH"
          for /f "usebackq tokens=1,* delims==" %%A in ("%ROOT%\deploy.env") do (
            if not "%%A"=="" set "%%A=%%B"
          )
          set "SSH=%WINDIR%\System32\OpenSSH\ssh.exe"
          set "SCP=%WINDIR%\System32\OpenSSH\scp.exe"
          "%SCP%" -P %TBHCLOCK_SSH_PORT% -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="%ROOT%\known_hosts" -i "%ROOT%\id_ed25519" "%RUNNER_TEMP%\tbhclock-release.tar.gz" "%TBHCLOCK_SSH_USER%@%TBHCLOCK_SSH_HOST%:incoming/tbhclock-${{ inputs.commit_sha }}.tar.gz" || exit /b 51
          "%SSH%" -T -p %TBHCLOCK_SSH_PORT% -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="%ROOT%\known_hosts" -i "%ROOT%\id_ed25519" "%TBHCLOCK_SSH_USER%@%TBHCLOCK_SSH_HOST%" "deploy ${{ inputs.commit_sha }}" || exit /b 52
          echo VPS2_DEPLOY=PASS

      - name: Final result
        shell: cmd
        run: |
          @echo off
          echo TBHCLOCK_DEPLOY=PASS
