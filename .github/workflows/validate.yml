name: TBHClock - Validate & Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/runner-check.yml"
      - ".github/workflows/validate.yml"
      - "ops/vps2/**"

permissions:
  contents: read

concurrency:
  group: tbhclock-main-pipeline
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source on TBH-CLOCK-WIN01
    runs-on: [self-hosted, Windows, X64, tbh-clock]
    timeout-minutes: 10

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Runner identity and toolchain
        shell: cmd
        run: |
          @echo off
          if /I not "%RUNNER_NAME%"=="TBH-CLOCK-WIN01" exit /b 11
          git --version || exit /b 12
          node --version || exit /b 13
          npm --version || exit /b 14
          where ssh.exe || exit /b 15
          echo RUNNER_TOOLCHAIN=PASS

      - name: JavaScript syntax
        shell: cmd
        run: |
          @echo off
          node --check server.js || exit /b 21
          node --check src\attendance.js || exit /b 22
          node --check src\googleSheets.js || exit /b 23
          node --check public\app.js || exit /b 24
          node --check tests\attendance.test.js || exit /b 25
          node --check tests\frontend.test.js || exit /b 26
          echo JS_SYNTAX=PASS

      - name: Attendance tests
        shell: cmd
        run: |
          @echo off
          npm test || exit /b 31
          echo ATTENDANCE_TESTS=PASS

      - name: Secret safety
        shell: cmd
        run: |
          @echo off
          if exist .env exit /b 41
          if exist secrets\google-service-account.json exit /b 42
          git ls-files --error-unmatch .env >nul 2>&1
          if %ERRORLEVEL%==0 exit /b 43
          git ls-files --error-unmatch secrets/google-service-account.json >nul 2>&1
          if %ERRORLEVEL%==0 exit /b 44
          echo SECRET_SAFETY=PASS
          exit /b 0

      - name: Final validate result
        shell: cmd
        run: |
          @echo off
          echo TBHCLOCK_VALIDATE=PASS
          echo DEPLOY_GATE=READY

  deploy:
    name: Deploy validated SHA from TBH-CLOCK-WIN01 to VPS2
    needs: validate
    runs-on: [self-hosted, Windows, X64, tbh-clock, vps2-deploy]
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.sha }}

    steps:
      - name: Runner identity
        shell: cmd
        run: |
          @echo off
          if /I not "%RUNNER_NAME%"=="TBH-CLOCK-WIN01" exit /b 51
          echo DEPLOY_RUNNER=PASS

      - name: Load dedicated VPS2 SSH configuration
        shell: cmd
        run: |
          @echo off
          set "ROOT=%ProgramData%\TBHClock-SSH"
          if not exist "%ROOT%\id_ed25519" exit /b 52
          if not exist "%ROOT%\known_hosts" exit /b 53
          if not exist "%ROOT%\deploy.env" exit /b 54
          for /f "usebackq tokens=1,* delims==" %%A in ("%ROOT%\deploy.env") do (
            if not "%%A"=="" set "%%A=%%B"
          )
          if "%TBHCLOCK_SSH_HOST%"=="" exit /b 55
          if "%TBHCLOCK_SSH_PORT%"=="" exit /b 56
          if "%TBHCLOCK_SSH_USER%"=="" exit /b 57
          echo SSH_CONFIG=PASS
          exit /b 0

      - name: Checkout exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: cmd
        run: |
          @echo off
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL=%%H"
          if /I not "%ACTUAL%"=="%TARGET_SHA%" exit /b 58
          echo COMMIT_SHA=PASS

      - name: VPS2 gateway ping
        shell: cmd
        run: |
          @echo off
          set "ROOT=%ProgramData%\TBHClock-SSH"
          for /f "usebackq tokens=1,* delims==" %%A in ("%ROOT%\deploy.env") do (
            if not "%%A"=="" set "%%A=%%B"
          )
          "%WINDIR%\System32\OpenSSH\ssh.exe" -T -p %TBHCLOCK_SSH_PORT% -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="%ROOT%\known_hosts" -i "%ROOT%\id_ed25519" "%TBHCLOCK_SSH_USER%@%TBHCLOCK_SSH_HOST%" ping || exit /b 61
          echo VPS2_GATEWAY_PING=PASS

      - name: VPS2 runtime bootstrap
        shell: cmd
        run: |
          @echo off
          set "ROOT=%ProgramData%\TBHClock-SSH"
          for /f "usebackq tokens=1,* delims==" %%A in ("%ROOT%\deploy.env") do (
            if not "%%A"=="" set "%%A=%%B"
          )
          "%WINDIR%\System32\OpenSSH\ssh.exe" -T -p %TBHCLOCK_SSH_PORT% -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="%ROOT%\known_hosts" -i "%ROOT%\id_ed25519" "%TBHCLOCK_SSH_USER%@%TBHCLOCK_SSH_HOST%" bootstrap || exit /b 62
          echo VPS2_RUNTIME_BOOTSTRAP=PASS

      - name: Require production runtime READY
        shell: cmd
        run: |
          @echo off
          set "ROOT=%ProgramData%\TBHClock-SSH"
          set "STATUS_FILE=%RUNNER_TEMP%\tbhclock-runtime-status.txt"
          for /f "usebackq tokens=1,* delims==" %%A in ("%ROOT%\deploy.env") do (
            if not "%%A"=="" set "%%A=%%B"
          )
          "%WINDIR%\System32\OpenSSH\ssh.exe" -T -p %TBHCLOCK_SSH_PORT% -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="%ROOT%\known_hosts" -i "%ROOT%\id_ed25519" "%TBHCLOCK_SSH_USER%@%TBHCLOCK_SSH_HOST%" runtime-check > "%STATUS_FILE%" 2>&1 || exit /b 63
          type "%STATUS_FILE%"
          findstr /C:"RUNTIME_CONFIG=READY" "%STATUS_FILE%" >nul || exit /b 64
          echo RUNTIME_CONFIG=READY

      - name: Deploy exact validated SHA
        shell: cmd
        run: |
          @echo off
          set "ROOT=%ProgramData%\TBHClock-SSH"
          for /f "usebackq tokens=1,* delims==" %%A in ("%ROOT%\deploy.env") do (
            if not "%%A"=="" set "%%A=%%B"
          )
          "%WINDIR%\System32\OpenSSH\ssh.exe" -T -p %TBHCLOCK_SSH_PORT% -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="%ROOT%\known_hosts" -i "%ROOT%\id_ed25519" "%TBHCLOCK_SSH_USER%@%TBHCLOCK_SSH_HOST%" "deploy %TARGET_SHA%" || exit /b 65
          echo VPS2_DEPLOY=PASS

      - name: VPS2 public ingress check
        shell: cmd
        run: |
          @echo off
          set "ROOT=%ProgramData%\TBHClock-SSH"
          for /f "usebackq tokens=1,* delims==" %%A in ("%ROOT%\deploy.env") do (
            if not "%%A"=="" set "%%A=%%B"
          )
          "%WINDIR%\System32\OpenSSH\ssh.exe" -T -p %TBHCLOCK_SSH_PORT% -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="%ROOT%\known_hosts" -i "%ROOT%\id_ed25519" "%TBHCLOCK_SSH_USER%@%TBHCLOCK_SSH_HOST%" public-check || exit /b 66

      - name: Final pipeline result
        shell: cmd
        run: |
          @echo off
          echo TBHCLOCK_VALIDATE_TO_DEPLOY=PASS
          echo PRODUCTION_HEALTH=PASS
